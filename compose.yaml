name: limitguard-platform

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-limitguard}
      POSTGRES_USER: ${POSTGRES_USER:-limitguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-limitguard}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  flyway:
    image: flyway/flyway:13.2.0
    command: ["-locations=filesystem:/flyway/sql", "migrate"]
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-limitguard}
      FLYWAY_USER: ${POSTGRES_USER:-limitguard}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-limitguard}
    volumes:
      - ./services/limitguard-core/src/main/resources/db/limitguard/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
